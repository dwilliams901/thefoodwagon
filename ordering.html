<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Order Station — The Food Wagon</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface-2: #21253a; --surface-3: #2a2f45;
  --border: #2e3347; --border-light: #3a4060;
  --text: #e8eaf0; --text-muted: #8891aa;
  --primary: #e87d2b; --primary-light: #f0a060;
  --success: #3bb56a; --danger: #e84f3b; --warning: #f0b429;
  --radius: 10px; --radius-lg: 14px; --shadow: 0 4px 20px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── LOADING ── */
#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:999}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── HEADER ── */
.app-header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.header-brand{display:flex;align-items:center;gap:10px}
.header-brand .logo{font-size:24px}
.header-brand h1{font-size:16px;font-weight:800;letter-spacing:-.01em}
.header-brand p{font-size:11px;color:var(--text-muted);margin-top:1px}
.cart-pill{background:var(--primary);color:#fff;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;display:none;border:none;transition:opacity .15s}
.cart-pill:active{opacity:.8}

/* ── LAYOUT ── */
.main-wrap{display:grid;grid-template-columns:1fr 350px;min-height:calc(100vh - 57px)}
@media(max-width:680px){.main-wrap{grid-template-columns:1fr}}

/* ── MENU PANEL ── */
.menu-panel{padding:20px;border-right:1px solid var(--border)}
.panel-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:16px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.menu-card{background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg);padding:16px 14px;transition:border-color .15s,background .15s;position:relative;user-select:none}
.menu-card.has-qty{border-color:var(--primary);background:var(--surface-2)}
.menu-card-name{font-size:15px;font-weight:600;line-height:1.3;margin-bottom:4px}
.menu-card-price{font-size:14px;font-weight:700;color:var(--primary-light);margin-bottom:14px}
.menu-card-price.no-price{color:var(--text-muted)}
.qty-controls{display:flex;align-items:center;gap:10px}
.qty-btn{width:42px;height:42px;border:none;border-radius:50%;background:var(--surface-3);color:var(--text);font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:300;transition:background .1s;flex-shrink:0}
.qty-btn:active{background:var(--primary)}
.qty-num{font-size:20px;font-weight:700;min-width:28px;text-align:center}
.qty-badge{position:absolute;top:-7px;right:-7px;background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.no-menu{text-align:center;padding:48px 20px;color:var(--text-muted);grid-column:1/-1}
.no-menu h3{color:var(--text);margin-bottom:6px;font-size:16px}

/* ── CART PANEL ── */
.cart-panel{background:var(--surface);display:flex;flex-direction:column;padding:20px;min-height:calc(100vh - 57px)}
@media(max-width:680px){
  .cart-panel{display:none;position:fixed;inset:0;z-index:100;min-height:100vh;overflow-y:auto}
  .cart-panel.open{display:flex}
}
.cart-items{flex:1;overflow-y:auto;margin-bottom:16px}
.cart-empty{text-align:center;padding:36px 16px;color:var(--text-muted);font-size:13px}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.cart-item-name{flex:1;font-size:14px;font-weight:500}
.cart-item-qty{font-size:12px;color:var(--text-muted)}
.cart-item-sub{font-size:14px;font-weight:700;color:var(--primary-light)}
.cart-divider{height:1px;background:var(--border);margin:4px 0 12px}
.cart-subtotal-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.cart-tax-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;margin-bottom:8px}
.cart-grand-divider{height:1px;background:var(--border-light);margin:6px 0 10px}
.cart-total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.cart-total-label{font-size:14px;font-weight:600;color:var(--text-muted)}
.cart-sub-amt{font-size:14px;font-weight:600;color:var(--text-muted)}
.cart-tax-amt{font-size:14px;font-weight:600;color:var(--text-muted)}
.cart-total-amt{font-size:26px;font-weight:800;color:var(--text)}
.name-input{width:100%;background:var(--surface-3);border:1px solid var(--border-light);border-radius:var(--radius);color:var(--text);padding:10px 12px;font-size:14px;font-family:inherit;margin-bottom:8px}
.name-input:focus{outline:none;border-color:var(--primary)}
.name-input::placeholder{color:var(--text-muted)}
.note-textarea{width:100%;background:var(--surface-3);border:1px solid var(--border-light);border-radius:var(--radius);color:var(--text);padding:10px 12px;font-size:13px;font-family:inherit;resize:none;min-height:52px;margin-bottom:16px}
.note-textarea:focus{outline:none;border-color:var(--primary)}
.note-textarea::placeholder{color:var(--text-muted)}
.payment-heading{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.pay-btn.full{grid-column:1/-1}
.pay-btn{background:var(--surface-3);border:2px solid var(--border-light);border-radius:var(--radius);color:var(--text);padding:11px 8px;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.pay-btn.active{border-color:var(--success);background:rgba(59,181,106,.12);color:var(--success)}
.place-btn{width:100%;padding:17px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-lg);font-size:17px;font-weight:800;cursor:pointer;letter-spacing:.02em;transition:opacity .15s,transform .1s}
.place-btn:disabled{opacity:.35;cursor:not-allowed}
.place-btn:not(:disabled):active{transform:scale(.98)}
.cart-close-btn{display:none;width:100%;padding:12px;background:var(--surface-3);color:var(--text-muted);border:none;border-radius:var(--radius);font-size:14px;cursor:pointer;margin-bottom:14px}
@media(max-width:680px){.cart-close-btn{display:block}}

/* ── FLOAT CART BTN (mobile) — removed ── */

/* ── RECENT ORDERS ── */
.recent-section{max-width:1000px;margin:0 auto;padding:20px;width:100%}
.order-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.order-num-chip{background:var(--surface-3);border-radius:8px;padding:4px 11px;font-size:13px;font-weight:700;min-width:54px;text-align:center;flex-shrink:0}
.status-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;flex-shrink:0}
.status-chip.open{background:rgba(240,180,41,.18);color:var(--warning)}
.status-chip.complete{background:rgba(59,181,106,.18);color:var(--success)}
.order-row-items{flex:1;font-size:13px;color:var(--text-muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.order-row-total{font-size:14px;font-weight:700;flex-shrink:0}
.order-row-time{font-size:12px;color:var(--text-muted);flex-shrink:0}

/* ── MOD BADGE on menu card ── */
.menu-card.is-mod{border-color:rgba(240,180,41,.4)}
.menu-card.is-mod.has-qty{border-color:var(--primary)}
.mod-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(240,180,41,.14);border:1px solid rgba(240,180,41,.35);color:#d97706;border-radius:6px;font-size:11px;font-weight:700;padding:2px 7px;margin-bottom:6px;margin-right:4px;line-height:1.4}
.combo-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(59,181,106,.14);border:1px solid rgba(59,181,106,.35);color:var(--success);border-radius:6px;font-size:11px;font-weight:700;padding:2px 7px;margin-bottom:6px;margin-right:4px;line-height:1.4}
.addon-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(99,102,241,.14);border:1px solid rgba(99,102,241,.35);color:#818cf8;border-radius:6px;font-size:11px;font-weight:700;padding:2px 7px;margin-bottom:6px;line-height:1.4}
.menu-card-name{cursor:pointer}
.menu-card-name:active{opacity:.7}
.mod-sub-label{font-size:11px;color:var(--success);margin-top:4px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.combo-includes-label{font-size:11px;color:var(--text-muted);margin-top:4px;line-height:1.3}
.cart-item-mod{font-size:11px;color:var(--success);font-style:italic;margin-top:1px}
.cart-item-addon{font-size:11px;color:#818cf8;font-style:italic;margin-top:1px}
.cart-item-combo{font-size:11px;color:var(--text-muted);margin-top:1px}

/* ── MOD PICKER MODAL ── */
#mod-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:500;align-items:flex-end;justify-content:center;padding:0}
#mod-modal.visible{display:flex}
.mod-modal-box{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:480px;padding:24px 20px 32px;border-top:1px solid var(--border-light);box-shadow:0 -6px 30px rgba(0,0,0,.5)}
.mod-modal-title{font-size:17px;font-weight:800;margin-bottom:4px}
.mod-modal-note{font-size:13px;color:var(--warning);margin-bottom:16px;line-height:1.4}
.mod-modal-subheading{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.mod-options-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.mod-option-btn{background:var(--surface-3);border:2px solid var(--border-light);border-radius:var(--radius);color:var(--text);padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.mod-option-btn.selected{border-color:var(--success);background:rgba(59,181,106,.12);color:var(--success)}
.mod-option-btn.skip{color:var(--text-muted);font-weight:500}
.addon-option-btn{background:var(--surface-3);border:2px solid var(--border-light);border-radius:var(--radius);color:var(--text);padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:border-color .15s,background .15s;display:flex;align-items:center;justify-content:space-between;gap:10px}
.addon-option-btn.selected{border-color:#818cf8;background:rgba(99,102,241,.12);color:#818cf8}
.addon-option-price{font-size:13px;font-weight:700;opacity:.8}
.mod-add-btn{width:100%;padding:16px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-lg);font-size:16px;font-weight:800;cursor:pointer;opacity:.4;transition:opacity .15s}
.mod-add-btn.ready{opacity:1}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--surface-2);border:1px solid var(--border-light);color:var(--text);padding:11px 20px;border-radius:24px;font-size:14px;font-weight:500;box-shadow:var(--shadow);animation:fadeUp .22s ease;white-space:nowrap}
.toast.success{border-color:var(--success);color:var(--success)}
.toast.error{border-color:var(--danger);color:var(--danger)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="loading-overlay">
  <div style="font-size:32px">🍖</div>
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text-muted)">Connecting…</div>
</div>

<header class="app-header">
  <div class="header-brand">
    <span class="logo">🍖</span>
    <div>
      <h1>The Food Wagon</h1>
      <p>Order Station</p>
    </div>
  </div>
  <button class="cart-pill" id="cart-pill" onclick="openCart()">🛒 0 items</button>
</header>

<div class="main-wrap">

  <!-- ── MENU ── -->
  <div class="menu-panel">
    <div class="panel-title">Menu</div>
    <div class="menu-grid" id="menu-grid">
      <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">Loading menu…</div>
    </div>
  </div>

  <!-- ── CART ── -->
  <div class="cart-panel" id="cart-panel">
    <button class="cart-close-btn" onclick="closeCart()">✕ Close</button>
    <div class="panel-title">Current Order</div>

    <div class="cart-items" id="cart-items">
      <div class="cart-empty">No items yet.<br>Select from the menu.</div>
    </div>

    <div class="cart-divider"></div>
    <div class="cart-subtotal-row">
      <span class="cart-total-label">Subtotal</span>
      <span class="cart-sub-amt" id="cart-subtotal">$0.00</span>
    </div>
    <div class="cart-tax-row">
      <span class="cart-total-label">Tax (10%)</span>
      <span class="cart-tax-amt" id="cart-tax">$0.00</span>
    </div>
    <div class="cart-grand-divider"></div>
    <div class="cart-total-row">
      <span class="cart-total-label">Total</span>
      <span class="cart-total-amt" id="cart-total">$0.00</span>
    </div>

    <input id="order-name" class="name-input" type="text" placeholder="Customer name (optional)">
    <textarea id="order-note" class="note-textarea" placeholder="Special requests, allergies…" rows="2"></textarea>

    <div class="payment-heading">Payment Received Via</div>
    <div class="payment-grid">
      <button class="pay-btn" data-method="cash"    onclick="pickPayment(this)">💵 Cash</button>
      <button class="pay-btn" data-method="card"    onclick="pickPayment(this)">💳 Card</button>
      <button class="pay-btn" data-method="venmo"   onclick="pickPayment(this)">📱 Venmo</button>
      <button class="pay-btn" data-method="cashapp" onclick="pickPayment(this)">💚 CashApp</button>
      <button class="pay-btn full" data-method="other" onclick="pickPayment(this)">🔄 Other</button>
    </div>

    <button class="place-btn" id="place-btn" onclick="placeOrder()" disabled>Place Order</button>
  </div>

</div>

<!-- Float cart button (mobile) -->

<!-- Recent Orders -->
<div class="recent-section">
  <div class="panel-title" style="margin-bottom:12px">Recent Orders</div>
  <div id="order-history"></div>
</div>

<!-- Item Customization Modal (substitutions + add-ons) -->
<div id="mod-modal" onclick="if(event.target.id==='mod-modal') closeCustomizeModal()">
  <div class="mod-modal-box">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
      <div class="mod-modal-title" id="mod-modal-title">Customize Item</div>
      <button onclick="closeCustomizeModal()" style="background:none;border:none;color:var(--text-muted);font-size:22px;line-height:1;cursor:pointer;padding:0 2px">×</button>
    </div>
    <div class="mod-modal-note" id="mod-modal-note" style="display:none"></div>

    <div id="mod-combo-section" style="display:none">
      <div class="mod-modal-subheading">Make it a combo?</div>
      <div class="mod-options-grid" id="mod-combo-grid"></div>
    </div>

    <div id="mod-sub-section" style="display:none">
      <div class="mod-modal-subheading">Choose a substitution:</div>
      <div class="mod-options-grid" id="mod-options-grid"></div>
    </div>

    <div id="mod-addon-section" style="display:none">
      <div class="mod-modal-subheading">Add-ons:</div>
      <div class="mod-options-grid" id="mod-addon-grid"></div>
    </div>

    <button class="mod-add-btn ready" id="mod-add-btn" onclick="confirmMod()">Add to Order</button>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
// ── Firebase ──────────────────────────────────────────────
firebase.initializeApp({
  apiKey: "AIzaSyD1uy6fNfjFDByoj4F85FYXU9NmVnVNyqI",
  authDomain: "thefoodwagon-44c60.firebaseapp.com",
  databaseURL: "https://thefoodwagon-44c60-default-rtdb.firebaseio.com",
  projectId: "thefoodwagon-44c60",
  storageBucket: "thefoodwagon-44c60.firebasestorage.app",
  messagingSenderId: "47761433364",
  appId: "1:47761433364:web:416dc49ef5d1758f659801"
});
const db = firebase.database();

// ── State ─────────────────────────────────────────────────
let menuItems = [];
let invItems = [];       // raw inventory items, for add-on stock deduction
let cart = {};           // { menuItemId: qty }
let cartMods = {};       // { menuItemId: substitutionString }
let cartAddons = {};     // { menuItemId: [{itemId, name, price, servingsUsed}] }
let cartCombo = {};      // { menuItemId: true } — customer wants the combo version
let selectedPayment = null;
let recentOrders = [];
let loaded = false;
let pendingModId = null; // menuItemId awaiting mod/add-on selection
let pendingModChoice = null; // chosen sub string or '' for skip

// ── Utils ─────────────────────────────────────────────────
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function uuid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pad(n){ return String(n).padStart(3,'0'); }

function showToast(msg, type='info', ms=3200){
  const c=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className='toast '+type; t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>t.remove(), ms);
}

// ── Firebase listeners ────────────────────────────────────
db.ref('menuItems').on('value', snap => {
  menuItems = Object.values(snap.val()||{}).filter(Boolean);
  renderMenuGrid();
  if (!loaded) {
    document.getElementById('loading-overlay').style.display='none';
    loaded = true;
  }
});

// Raw inventory items — needed to deduct stock when an add-on is ordered
db.ref('items').on('value', snap => {
  invItems = Object.values(snap.val()||{}).filter(Boolean);
});

db.ref('orders').orderByChild('createdAt').limitToLast(25).on('value', snap => {
  recentOrders = Object.values(snap.val()||{}).filter(Boolean)
    .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  renderHistory();
});

// ── Menu ──────────────────────────────────────────────────
function itemNeedsCustomization(mi){
  return !!(mi && (mi.modFlag || (mi.addOns && mi.addOns.length) || mi.isCombo));
}

// Effective per-unit price for a cart line: the combo price (if the customer
// chose combo and one is set — falls back to the regular price otherwise),
// plus any selected add-ons.
function effectiveUnitPrice(mi, id){
  if (!mi) return 0;
  const base = (cartCombo[id] && mi.comboPrice > 0) ? mi.comboPrice : (mi.salePrice||0);
  const addonsTotal = (cartAddons[id]||[]).reduce((s,a)=>s+(a.price||0),0);
  return base + addonsTotal;
}

function renderMenuGrid(){
  const g = document.getElementById('menu-grid');
  if (!menuItems.length){
    g.innerHTML = `<div class="no-menu"><h3>No menu items found</h3><p>Add items in the inventory manager's Menu tab first.</p></div>`;
    return;
  }
  g.innerHTML = menuItems.map(mi => {
    const qty = cart[mi.id]||0;
    const hasPrice = mi.salePrice > 0;
    const hasMod = !!mi.modFlag;
    const addOns = mi.addOns || [];
    const hasAddons = addOns.length > 0;
    const comboAvailable = !!mi.isCombo;
    const comboItems = comboAvailable ? (mi.comboItems||[]) : [];
    const needsCustomization = itemNeedsCustomization(mi);
    const chosenSub = cartMods[mi.id];
    const chosenAddons = cartAddons[mi.id] || [];
    const wantsCombo = qty > 0 && !!cartCombo[mi.id];

    const subLabel = qty > 0 && hasMod && chosenSub ? `✓ Sub: ${chosenSub}` : '';
    const addonLabel = qty > 0 && chosenAddons.length
      ? `✓ ${chosenAddons.map(a=>a.name).join(', ')}` : '';
    const comboLabel = wantsCombo && comboItems.length
      ? `✓ Combo: Includes ${comboItems.map(c=>c.name+(c.qty>1?' ×'+c.qty:'')).join(', ')}` : '';

    const displayPrice = (wantsCombo && mi.comboPrice > 0) ? mi.comboPrice : mi.salePrice;

    const nameAttr = needsCustomization
      ? `onclick="openCustomizeModal('${mi.id}')"`
      : `onclick="adj('${mi.id}',1)"`;

    return `<div class="menu-card ${qty>0?'has-qty':''} ${hasMod?'is-mod':''}" id="mc-${mi.id}">
      ${qty>0?`<div class="qty-badge">${qty}</div>`:''}
      ${(hasMod||comboAvailable||hasAddons)?`<div>
        ${hasMod?`<span class="mod-badge">⚠️ Mod</span>`:''}
        ${comboAvailable?`<span class="combo-badge">🍱 Combo available</span>`:''}
        ${hasAddons?`<span class="addon-badge">+ Add-Ons</span>`:''}
      </div>`:''}
      <div class="menu-card-name" ${nameAttr}>${esc(mi.name)}</div>
      <div class="menu-card-price ${hasPrice?'':'no-price'}">${hasPrice?'$'+displayPrice.toFixed(2):'No price'}</div>
      ${comboLabel?`<div class="combo-includes-label" style="color:var(--success)">${esc(comboLabel)}</div>`:''}
      ${subLabel?`<div class="mod-sub-label">${esc(subLabel)}</div>`:''}
      ${addonLabel?`<div class="mod-sub-label" style="color:#818cf8">${esc(addonLabel)}</div>`:''}
      <div class="qty-controls">
        <button class="qty-btn" onclick="adj('${mi.id}',-1)">−</button>
        <span class="qty-num">${qty}</span>
        <button class="qty-btn" onclick="adj('${mi.id}',1)">+</button>
      </div>
    </div>`;
  }).join('');
}

function adj(id, delta){
  const prev = cart[id]||0;
  const n = Math.max(0, prev+delta);
  if (n===0){
    delete cart[id];
    delete cartMods[id];
    delete cartAddons[id];
    delete cartCombo[id];
  } else {
    cart[id]=n;
  }
  // Show customize modal when going from 0→1 for an item with mods or add-ons
  if (delta > 0 && prev === 0) {
    const mi = menuItems.find(m=>m.id===id);
    if (itemNeedsCustomization(mi)) {
      openCustomizeModal(id);
      return; // don't re-render yet — modal will trigger render on confirm
    }
  }
  renderMenuGrid();
  renderCartPanel();
  updateCartBadge();
}

// ── Item Customization (substitutions + add-ons) ───────────
function openCustomizeModal(id) {
  const mi = menuItems.find(m=>m.id===id);
  if (!mi) return;
  pendingModId = id;
  pendingModChoice = cartMods[id] || '';

  document.getElementById('mod-modal-title').textContent = esc(mi.name);

  const comboSection = document.getElementById('mod-combo-section');
  if (mi.isCombo) {
    comboSection.style.display = 'block';
    const comboItems = mi.comboItems || [];
    const comboPrice = mi.comboPrice > 0 ? mi.comboPrice : mi.salePrice;
    const includesText = comboItems.length
      ? ' — includes ' + comboItems.map(c=>c.name+(c.qty>1?' ×'+c.qty:'')).join(', ')
      : '';
    const current = !!cartCombo[id];
    const grid = document.getElementById('mod-combo-grid');
    grid.innerHTML = `
      <button class="mod-option-btn${!current?' selected':''}" data-comboval="no" onclick="selectComboOption(this)">Item only — $${(mi.salePrice||0).toFixed(2)}</button>
      <button class="mod-option-btn${current?' selected':''}" data-comboval="yes" onclick="selectComboOption(this)">Combo — $${comboPrice.toFixed(2)}${esc(includesText)}</button>
    `;
  } else {
    comboSection.style.display = 'none';
  }

  const noteEl = document.getElementById('mod-modal-note');
  if (mi.modFlag) {
    noteEl.style.display = 'block';
    noteEl.textContent = mi.modNote
      ? '⚠️ ' + mi.modNote
      : '⚠️ Ingredient issue — choose a substitution or continue as-is.';
  } else {
    noteEl.style.display = 'none';
  }

  const subSection = document.getElementById('mod-sub-section');
  if (mi.modFlag) {
    subSection.style.display = 'block';
    const opts = mi.modOptions || [];
    const grid = document.getElementById('mod-options-grid');
    const current = pendingModChoice;
    // Build buttons; use data-value to avoid quote-escaping in onclick
    const makeBtn = (label, val, extra='') =>
      `<button class="mod-option-btn${extra}${val===current?' selected':''}" data-modval="${esc(val)}" onclick="selectModOption(this)">${esc(label)}</button>`;
    grid.innerHTML = opts.map(o => makeBtn(o, o)).join('')
      + makeBtn('No substitution — continue as-is', '', ' skip');
  } else {
    subSection.style.display = 'none';
  }

  const addonSection = document.getElementById('mod-addon-section');
  const addOns = mi.addOns || [];
  if (addOns.length) {
    addonSection.style.display = 'block';
    const existing = cartAddons[id] || [];
    const grid = document.getElementById('mod-addon-grid');
    grid.innerHTML = addOns.map((a, idx) => {
      const selected = existing.some(e => e.name === a.name);
      return `<button class="addon-option-btn${selected?' selected':''}" data-idx="${idx}" onclick="toggleAddonOption(this)">
        <span>${esc(a.name)}</span>
        <span class="addon-option-price">+$${(a.price||0).toFixed(2)}</span>
      </button>`;
    }).join('');
  } else {
    addonSection.style.display = 'none';
  }

  document.getElementById('mod-add-btn').classList.add('ready');
  document.getElementById('mod-modal').classList.add('visible');
}

function selectModOption(btn) {
  document.querySelectorAll('#mod-options-grid .mod-option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  pendingModChoice = btn.dataset.modval; // '' for skip, text for a sub
}

function selectComboOption(btn) {
  document.querySelectorAll('#mod-combo-grid .mod-option-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function toggleAddonOption(btn) {
  btn.classList.toggle('selected');
}

function confirmMod() {
  const id = pendingModId;
  if (!id) return;
  const mi = menuItems.find(m=>m.id===id);

  if (mi && mi.isCombo) {
    const sel = document.querySelector('#mod-combo-grid .mod-option-btn.selected');
    const wantsCombo = sel ? sel.dataset.comboval === 'yes' : false;
    if (wantsCombo) cartCombo[id] = true;
    else delete cartCombo[id];
  }

  if (mi && mi.modFlag) {
    if (pendingModChoice) cartMods[id] = pendingModChoice;
    else delete cartMods[id];
  }

  if (mi && mi.addOns && mi.addOns.length) {
    const selected = [];
    document.querySelectorAll('#mod-addon-grid .addon-option-btn.selected').forEach(btn => {
      const idx = parseInt(btn.dataset.idx, 10);
      if (mi.addOns[idx]) {
        const a = mi.addOns[idx];
        selected.push({ itemId: a.itemId||null, name: a.name, price: a.price||0, servingsUsed: a.servingsUsed||0 });
      }
    });
    if (selected.length) cartAddons[id] = selected;
    else delete cartAddons[id];
  }

  // This modal can be opened via a name-click before the item is in the cart
  if (!cart[id]) cart[id] = 1;

  pendingModId = null;
  pendingModChoice = null;
  document.getElementById('mod-modal').classList.remove('visible');
  renderMenuGrid();
  renderCartPanel();
  updateCartBadge();
}

function closeCustomizeModal() {
  pendingModId = null;
  pendingModChoice = null;
  document.getElementById('mod-modal').classList.remove('visible');
}

// ── Cart ──────────────────────────────────────────────────
function renderCartPanel(){
  const el = document.getElementById('cart-items');
  const totalEl = document.getElementById('cart-total');
  const placeBtn = document.getElementById('place-btn');
  const entries = Object.entries(cart);

  if (!entries.length){
    el.innerHTML = '<div class="cart-empty">No items yet.<br>Select from the menu.</div>';
    document.getElementById('cart-subtotal').textContent = '$0.00';
    document.getElementById('cart-tax').textContent = '$0.00';
    totalEl.textContent = '$0.00';
    placeBtn.disabled = true;
    return;
  }

  const TAX_RATE = 0.10;
  let subtotal = 0;
  el.innerHTML = entries.map(([id,qty]) => {
    const mi = menuItems.find(m=>m.id===id);
    if (!mi) return '';
    const mod = cartMods[id];
    const addons = cartAddons[id] || [];
    const wantsCombo = !!cartCombo[id];
    const unitPrice = effectiveUnitPrice(mi, id);
    const sub = qty*unitPrice;
    subtotal += sub;
    const comboItems = (wantsCombo && mi.isCombo) ? (mi.comboItems||[]) : [];
    const comboLine = comboItems.length
      ? `🍱 Combo — Includes: ${comboItems.map(c=>esc(c.name)+(c.qty>1?' ×'+c.qty:'')).join(', ')}`
      : '';
    const nameClick = itemNeedsCustomization(mi) ? ` style="cursor:pointer" onclick="openCustomizeModal('${id}')"` : '';
    return `<div class="cart-item" style="flex-wrap:wrap">
      <span class="cart-item-name"${nameClick}>${esc(mi.name)}</span>
      <span class="cart-item-qty">× ${qty}</span>
      <span class="cart-item-sub">${unitPrice>0?'$'+sub.toFixed(2):'—'}</span>
      ${mod?`<div style="width:100%" class="cart-item-mod">↳ Sub: ${esc(mod)}</div>`:''}
      ${addons.length?`<div style="width:100%" class="cart-item-addon">↳ + ${addons.map(a=>esc(a.name)+' ($'+(a.price||0).toFixed(2)+')').join(', ')}</div>`:''}
      ${comboLine?`<div style="width:100%" class="cart-item-combo">↳ ${comboLine}</div>`:''}
    </div>`;
  }).join('');

  const tax = subtotal * TAX_RATE;
  const grandTotal = subtotal + tax;
  document.getElementById('cart-subtotal').textContent = '$'+subtotal.toFixed(2);
  document.getElementById('cart-tax').textContent = '$'+tax.toFixed(2);
  totalEl.textContent = '$'+grandTotal.toFixed(2);
  placeBtn.disabled = !(entries.length && selectedPayment);
}

function updateCartBadge(){
  const count = Object.values(cart).reduce((s,v)=>s+v,0);
  const pill = document.getElementById('cart-pill');
  if (count>0){
    pill.style.display=''; pill.textContent=`🛒 ${count} item${count>1?'s':''}`;
  } else {
    pill.style.display='none';
  }
}

function pickPayment(btn){
  document.querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selectedPayment = btn.dataset.method;
  renderCartPanel();
}

function openCart(){
  document.getElementById('cart-panel').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCart(){
  document.getElementById('cart-panel').classList.remove('open');
  document.body.style.overflow='';
}

// ── Place Order ───────────────────────────────────────────
async function placeOrder(){
  if (!Object.keys(cart).length){ showToast('Add items first.','error'); return; }
  if (!selectedPayment){ showToast('Select a payment method.','error'); return; }

  const btn = document.getElementById('place-btn');
  btn.disabled = true;
  btn.textContent = 'Placing order…';

  try {
    // Atomic order number
    const result = await db.ref('orderCounter').transaction(n => (n||0)+1);
    const orderNum = result.snapshot.val();
    const now = new Date().toISOString();
    const note = document.getElementById('order-note').value.trim();
    const customerName = document.getElementById('order-name').value.trim();
    const TAX_RATE = 0.10;
    let subtotal = 0;

    const items = Object.entries(cart).map(([id,qty]) => {
      const mi = menuItems.find(m=>m.id===id);
      const mod = cartMods[id] || null;
      const addOns = cartAddons[id] || [];
      const addOnsTotal = addOns.reduce((s,a)=>s+(a.price||0),0);
      const wantsCombo = !!cartCombo[id];
      const unitPrice = effectiveUnitPrice(mi, id);
      const sub = qty*unitPrice;
      subtotal += sub;
      const comboIncludes = (wantsCombo && mi?.isCombo && mi.comboItems && mi.comboItems.length)
        ? mi.comboItems.map(c=>({ menuItemId:c.menuItemId, name:c.name, qty:c.qty||1 }))
        : null;
      return {
        menuItemId:id, menuItemName:mi?.name||'?', qty,
        unitPrice:unitPrice-addOnsTotal, subtotal:sub,
        ...(mod?{mod}:{}),
        ...(addOns.length?{addOns, addOnsTotal}:{}),
        ...(comboIncludes?{isCombo:true, comboIncludes}:{})
      };
    });

    const tax = subtotal * TAX_RATE;
    const total = subtotal + tax;
    const ordId = uuid();
    await db.ref('orders/'+ordId).set({
      id: ordId, orderNumber: orderNum, items, note, name: customerName,
      subtotal, tax, total,
      paymentMethod: selectedPayment, paid: true,
      status: 'open', createdAt: now, completedAt: null
    });

    // Deduct inventory stock for any ingredient-linked add-ons and any combo
    // extras selected on this order
    await deductOrderStock(items, orderNum, now);

    // Reset
    cart = {}; cartMods = {}; cartAddons = {}; cartCombo = {}; selectedPayment = null;
    document.getElementById('order-name').value = '';
    document.getElementById('order-note').value = '';
    document.querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('active'));
    renderMenuGrid(); renderCartPanel(); updateCartBadge();
    closeCart();
    showToast(`✅ Order #${pad(orderNum)} placed!`, 'success', 4000);

  } catch(e){
    showToast('Error: '+e.message,'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Place Order';
    // Re-evaluate disabled state
    setTimeout(() => {
      const entries = Object.entries(cart);
      document.getElementById('place-btn').disabled = !(entries.length && selectedPayment);
    }, 50);
  }
}

// Deducts inventory stock for every ingredient-linked add-on, plus the
// ingredients of any combo-included items when a line ordered the combo, and
// logs a matching "out" transaction for each — same as the recap tool does.
// (The base menu item's own ingredients are still only deducted through the
// manual Daily Recap, since the order station doesn't track every raw
// ingredient the way it now does for add-ons and combo extras.)
async function deductOrderStock(orderItems, orderNum, now) {
  // Merge servings needed per inventory item across every order line
  const merged = {}; // { itemId: { name, totalServings } }
  const addServings = (itemId, name, servings) => {
    if (!itemId || !(servings > 0)) return;
    if (!merged[itemId]) merged[itemId] = { name, totalServings: 0 };
    merged[itemId].totalServings += servings;
  };

  orderItems.forEach(line => {
    (line.addOns || []).forEach(a => {
      addServings(a.itemId, a.name, (a.servingsUsed||0) * line.qty);
    });
    if (line.isCombo && line.comboIncludes) {
      line.comboIncludes.forEach(c => {
        const inclMi = menuItems.find(m => m.id === c.menuItemId);
        if (!inclMi) return;
        (inclMi.ingredients || []).forEach(ing => {
          addServings(ing.itemId, ing.itemName, ing.servingsUsed * (c.qty||1) * line.qty);
        });
      });
    }
  });

  const ids = Object.keys(merged);
  if (!ids.length) return;

  const date = now.split('T')[0];
  await Promise.all(ids.map(async itemId => {
    const inv = invItems.find(i => i.id === itemId);
    if (!inv || !inv.servingsPerUnit) return;
    const { name, totalServings } = merged[itemId];
    const unitsDeducted = totalServings / inv.servingsPerUnit;
    if (unitsDeducted <= 0) return;

    // Atomic stock decrement
    await db.ref('items/'+itemId).transaction(cur => {
      if (cur === null) return cur;
      return { ...cur, currentStock: Math.max(0, (cur.currentStock||0) - unitsDeducted) };
    });

    const txId = uuid();
    await db.ref('transactions/'+txId).set({
      id: txId, date,
      itemId, itemName: inv.name,
      type: 'out',
      qty: unitsDeducted, servings: totalServings,
      unitCost: inv.unitCost || 0,
      totalCost: unitsDeducted * (inv.unitCost || 0),
      note: `Order #${pad(orderNum)} — add-on/combo: ${name}`,
      source: 'order-addon-combo',
      createdAt: now
    });
  }));
}

// ── History ───────────────────────────────────────────────
function renderHistory(){
  const c = document.getElementById('order-history');
  if (!recentOrders.length){
    c.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px">No orders yet.</div>';
    return;
  }
  c.innerHTML = recentOrders.slice(0,20).map(o => {
    const t = new Date(o.createdAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const items = (o.items||[]).map(i=>`${i.qty}× ${i.menuItemName}`).join(', ');
    const st = o.status||'open';
    return `<div class="order-row">
      <span class="order-num-chip">#${pad(o.orderNumber||0)}</span>
      <span class="status-chip ${st}">${st==='complete'?'✓ Done':'⏳ Open'}</span>
      <span class="order-row-items">${esc(items)}</span>
      <span class="order-row-total">$${(o.total||0).toFixed(2)}</span>
      <span class="order-row-time">${t}</span>
    </div>`;
  }).join('');
}
</script>
